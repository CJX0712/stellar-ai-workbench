# Author: 晨星
[package]
name = "stellar-ai-workbench"
version = "0.1.0"
description = "Stellar AI Workbench - 模块化桌面 AI 工作台"
authors = ["晨星"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stellar_ai_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
