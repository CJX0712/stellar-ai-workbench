# Author: 晨星
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-ai-workbench-backend"
version = "0.1.0"
description = "Stellar AI Workbench 后端：模块化推理网关 / 可插拔 RAG / 原生智能体内核"
authors = [{ name = "晨星" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.14",
    "starlette==1.6.0",
    "uvicorn==0.34.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "openai==1.109.1",
    "numpy==2.5.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
# 向量库为可选增强：不装也能跑（自动回退进程内向量存储），详见 README「依赖替换说明」
lancedb = ["lancedb==0.24.3", "pyarrow>=18"]

[tool.setuptools]
packages = ["app", "app.core", "app.modules", "app.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
